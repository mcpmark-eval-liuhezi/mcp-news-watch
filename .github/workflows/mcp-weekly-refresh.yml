# ───────────────────────────────────────────────────────────────────────
# mcp-news-watch — Weekly MCP News Refresh (manual trigger)
# ───────────────────────────────────────────────────────────────────────
#
# What the weekly refresh should eventually do:
#   1. On manual trigger (workflow_dispatch), search for the latest
#      substantive Model Context Protocol (MCP) news from roughly the
#      past week, drawing on more than one source to catch real
#      reporting rather than evergreen explainers of what MCP is.
#   2. Filter out evergreen explainers and keep only stories that
#      describe a specific new development: a vendor announcement,
#      an adoption signal, a security finding, or a shift in how the
#      ecosystem is being used.
#   3. For every kept story, create an issue titled "Digest: <short
#      headline>" whose body carries the source name, the link, and a
#      2-3 sentence summary of what the story actually reports, and
#      add a comment on each issue explaining why that story matters
#      for the team briefing.
#   4. Update a consolidated digest (e.g. a DIGEST.md file or an
#      issues index) so there is one place to look before the
#      briefing.
#   5. Optionally distribute the refreshed digest to the team's
#      newsletter or meeting invite as a final step.
#
# For now, steps 1-3 are carried out manually via the "Digest:"
# issues already present in this repository; this workflow exists so
# the whole cycle can be automated and so the manual trigger is
# wired up for the first run. A subsequent commit can swap in the
# automation logic above.
# ───────────────────────────────────────────────────────────────────────

name: Weekly MCP News Refresh

on:
  workflow_dispatch:
    inputs:
      refresh_note:
        description: One-line note on what changed this week (optional)
        required: false
        default: ''

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    name: Run weekly MCP news refresh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Placeholder — wire up the weekly refresh
        run: |
          echo "Weekly MCP news refresh goes here once the digest automation is ready."
          echo "Expected steps: search for recent MCP news, create 'Digest: <headline>' issues, add relevance comments, and update the digest index."
          echo "Note: ${{ inputs.refresh_note }}"
