# Weekly MCP News Refresh
# Manual trigger (workflow_dispatch) plus an optional cron schedule.
# This workflow is the hook for the weekly briefing refresh.
name: Weekly MCP News Refresh

# Trigger: manual dispatch for the weekly refresh,
# and an optional cron schedule (Mondays 09:00 UTC) so the digest
# can be regenerated automatically each week.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Comment block — what the weekly refresh should eventually do:
      #
      # 1. Fetch the latest MCP-related news stories from sources such as
      #    GitHub issues/PRs in modelcontextprotocol, microsoft/mcp,
      #    modelcontextprotocol/registry, and reputable tech新闻 outlets.
      # 2. Deduplicate against existing issues in this repository.
      # 3. Create or update a "Digest: <short headline>" issue per new story,
      #    carrying the source, the link, and a two-to-three sentence summary.
      # 4. Post a comment on each new issue explaining why the story matters
      #    for the team briefing.
      # 5. Update the README digest table with the newest stories and their
      #    links, so the repo stays the single source of truth for the digest.
      # 6. Optionally open a pull request summarizing the week's changes.
      - name: Comment block — weekly refresh plan (informational)
        run: |
          echo "WEEKLY REFRESH PLAN"
          echo "1. Fetch latest MCP news from modelcontextprotocol, microsoft/mcp,"
          echo "   modelcontextprotocol/registry, and reputable tech news."
          echo "2. Deduplicate against existing issues in this repository."
          echo "3. Create/update a Digest issue per new story (source, link, summary)."
          echo "4. Comment on each new issue explaining why it matters for the briefing."
          echo "5. Update the README digest table with newest stories and links."
          echo "6. Optionally open a PR summarizing the week's changes."

      - name: Checkout repository
        uses: actions/checkout@v4

