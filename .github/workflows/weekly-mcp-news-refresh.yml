# Weekly MCP news refresh workflow
#
# Eventually this workflow should:
#   1. Fetch the latest MCP-related news for the past ~7 days across sources such as
#      the modelcontextprotocol spec repo, the official SDKs (typescript-sdk,
#      python-sdk), microsoft/mcp, the MCP registry, and industry outlets.
#   2. Deduplicate against stories already covered in issues #12, #13, #14 (and future
#      Digest issues) to avoid re-reporting what the team already has.
#   3. Append a fresh "Weekly Digest" section to README.md and open a new Issue
#      titled "Digest: <short headline>" for each newly found story, carrying the
#      source, link, and a 2-3 sentence summary.
#   4. Post a comment on each new Digest issue explaining why that story matters for
#      the team briefing, and update existing digest issues with any corrections.
#   5. Optionally run a light lint/link-check step over .github/workflows/*.yml so
#      manual dispatching stays safe.
#
# v1 is a manual placeholder: triggers only on workflow_dispatch, runs on
# ubuntu-latest, and prints a notice that the full refresh logic above is a TODO
# to be implemented in later commits.

name: Weekly MCP News Refresh

on:
  workflow_dispatch:
    inputs:
      days Back:
        description: "Lookback window in days (default 7)"
        required: false
        default: "7"
        type: number

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "Weekly MCP news refresh placeholder: implement fetch/dedupe/Digest-issue steps per the comment block above."
